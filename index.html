<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f1f1f">
    <title>Termo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="icone-ajuda ajuda" aria-label="Ajuda" role="button" tabindex="0">
            <img src="img/sinal-de-interrogacao.png" alt="Ajuda">
        </div>
        <h1>TERMO (beta)</h1>
        <section class="acoes-header" aria-label="Opções">
            <div class="icone-header" role="button" tabindex="0" aria-label="Estatísticas"><img src="img/grafico-estatistico.png" alt="Estatísticas"></div>
            <div class="icone-header config" role="button" tabindex="0" aria-label="Configurações"><img src="img/contexto.png" alt="Configurações"></div>
        </section>
    </header>

    <main>
        <section id="respostas" aria-label="Tabuleiro do jogo">
            <div class="resposta"><div class="letras"><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div></div></div>
            <div class="resposta"><div class="letras"><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div></div></div>
            <div class="resposta"><div class="letras"><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div></div></div>
            <div class="resposta"><div class="letras"><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div></div></div>
            <div class="resposta"><div class="letras"><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div></div></div>
            <div class="resposta"><div class="letras"><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div><div class="letra"></div></div></div>
        </section>

        <section id="teclado" aria-label="Teclado virtual">
            <div class="linha-teclado"><button>q</button><button>w</button><button>e</button><button>r</button><button>t</button><button>y</button><button>u</button><button>i</button><button>o</button><button>p</button></div>
            <div class="linha-teclado"><button>a</button><button>s</button><button>d</button><button>f</button><button>g</button><button>h</button><button>j</button><button>k</button><button>l</button></div>
            <div class="linha-teclado"><button id="enter">ENTER</button><button>z</button><button>x</button><button>c</button><button>v</button><button>b</button><button>n</button><button>m</button><button id="backspace" aria-label="Apagar última letra">⌫</button></div>
        </section>
    </main>

    <input id="entrada-mobile" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Digite sua palavra" tabindex="-1">
    <script src="script.js"></script>
</body>
</html>
